name: CI Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mining_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Verify package-lock.json exists
      run: ls -la backend/package-lock.json
      
    - name: Cache npm dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('backend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Lint
      working-directory: ./backend
      run: npm run lint
    
    - name: Run tests
      working-directory: ./backend
      run: npm test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mining_marketplace_test
        JWT_SECRET: test_jwt_secret
        NODE_ENV: test
    
    - name: Build
      working-directory: ./backend
      run: npm run build
    
    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: backend/coverage/
  
  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Verify package-lock.json exists
      run: ls -la frontend/mining-marketplace-web/package-lock.json
      
    - name: Cache npm dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/mining-marketplace-web/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install dependencies
      working-directory: ./frontend/mining-marketplace-web
      run: npm ci
    
    - name: Lint
      working-directory: ./frontend/mining-marketplace-web
      run: npm run lint
    
    - name: Run tests
      working-directory: ./frontend/mining-marketplace-web
      run: npm test
    
    - name: Build
      working-directory: ./frontend/mining-marketplace-web
      run: npm run build
    
    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: frontend/mining-marketplace-web/coverage/
  
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mining_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Install frontend dependencies
      working-directory: ./frontend/mining-marketplace-web
      run: npm ci
    
    - name: Start backend server
      working-directory: ./backend
      run: |
        npm run build
        nohup npm start &
        sleep 10
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mining_marketplace_test
        JWT_SECRET: test_jwt_secret
        NODE_ENV: test
        PORT: 4000
    
    - name: Start frontend server
      working-directory: ./frontend/mining-marketplace-web
      run: |
        npm run build
        nohup npm start &
        sleep 10
      env:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    
    - name: Run Cypress tests
      working-directory: ./frontend/mining-marketplace-web
      run: npx cypress run
    
    - name: Upload Cypress screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots
        path: frontend/mining-marketplace-web/cypress/screenshots/
    
    - name: Upload Cypress videos
      uses: actions/upload-artifact@v4
      with:
        name: cypress-videos
        path: frontend/mining-marketplace-web/cypress/videos/
